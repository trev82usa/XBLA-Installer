name: Build and release

# Builds XBLA-Installer for Windows and Linux on every push. When VERSION in xbla_installer.py
# is a version that has no release yet (on main), it publishes release v<VERSION> with both
# downloads attached and RELEASE_NOTES.md as the text. Bump VERSION to release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build XBLA-Installer.exe
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --onefile --windowed --name XBLA-Installer --add-data "games.json;." xbla_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: XBLA-Installer-windows
          path: dist/XBLA-Installer.exe

  linux:
    runs-on: ubuntu-22.04   # older glibc, so the binary runs on more distros
    steps:
      - uses: actions/checkout@v4
      - name: Build XBLA-Installer (Linux)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk python3-pip
          python3 -m pip install --quiet pyinstaller
          python3 -m PyInstaller --onefile --windowed --name XBLA-Installer --add-data "games.json:." xbla_installer.py
          mkdir -p pkg/XBLA-Installer
          cp dist/XBLA-Installer xbla_installer.py stfs.py xdvdfs.py games.json README.md LICENSE pkg/XBLA-Installer/
          tar -C pkg -czf XBLA-Installer-linux-x64.tar.gz XBLA-Installer
      - uses: actions/upload-artifact@v4
        with:
          name: XBLA-Installer-linux
          path: XBLA-Installer-linux-x64.tar.gz

  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: New version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' xbla_installer.py)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "new=0" >> "$GITHUB_OUTPUT"
          else echo "new=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == '1'
        with:
          path: art
      - name: Release
        if: steps.ver.outputs.new == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: XBLA Installer ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            art/XBLA-Installer-windows/XBLA-Installer.exe
            art/XBLA-Installer-linux/XBLA-Installer-linux-x64.tar.gz
